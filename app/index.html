<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>words check</title><script src="vendor/xlsx.full.min.js"></script><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">words check</div><nav class="topactions"><button id="chooseCourses">▧ 选择课程</button><button id="manageWords">▤ 管理词库</button><button id="fullscreen">⛶ 全屏课堂</button></nav></header><div class="shell"><aside><h3>我的课程 <small id="total"></small></h3><div class="courses" id="courses"></div><div class="asidebottom"><button id="import">＋ 导入 Excel 课程</button><button id="template">↓ 下载 Excel 模板</button><button id="manual">＋ 手动添加单词</button><button id="library">▤ 管理单词库</button><small>每个工作表对应一门课程。<br>数据自动保存在当前浏览器。</small></div></aside><main><div class="intro"><div><div class="eyebrow">CLASSROOM / VOCABULARY</div><h1>让每个单词，都有回响。</h1><div class="muted">选一门课，抽几张卡，开启今天的单词挑战。</div></div><span class="pill">● 课堂抽查模式</span></div><div class="settings"><label>本次抽取<input id="count" type="number" min="1" max="50" value="5"></label><label>检测方式<select id="mode"><option value="free">自由揭晓 · 双面遮挡</option><option value="cn">看中文 · 说英文</option><option value="en">看英文 · 说中文</option></select></label><label style="display:flex;align-items:center;padding-bottom:11px"><input type="checkbox" id="avoid" checked style="width:auto"> 优先抽未出现的词</label><button class="primary" id="draw">↻ 随机抽取</button></div><div class="bar"><div><b>本轮单词</b> <small id="round"></small></div><div><button id="hide">全部遮挡</button> <button id="reveal">全部揭晓</button></div></div><div class="cards" id="cards"></div><div class="foot"><span>✦ 点击卡片中的中文或英文区域，独立揭晓或重新遮挡。</span><span id="remaining"></span></div></main></div><input type="file" accept=".xlsx,.xls" id="file" hidden><dialog id="modal"></dialog><div class="toast" id="toast"></div><script src="default-words.js"></script><script src="app.js"></script></body></html>
